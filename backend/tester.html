<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GOSHTI Story Engine Tester</title>
<style>
  :root {
    --bg: #fff4e3; --surface: #fffbf4; --warm: #fbe3c4; --primary: #c2562f; --text: #4a2c1d;
    --muted: #8a6a55; --border: #ebcfae; --ok: #3f7d3a; --bad: #b3261e; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Noto Sans Devanagari", sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; }
  header span { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  form { display: grid; gap: 12px; align-content: start; position: sticky; top: 12px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input, select, textarea { font: inherit; color: var(--text); background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 18px; background: var(--primary); color: #fff; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--border); padding: 6px 12px; font-weight: 600; font-size: 13px; }
  .hidden { display: none !important; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .pill { background: var(--warm); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .pill.ok { background: #dcefd8; color: var(--ok); font-weight: 700; }
  .pill.bad { background: #f7dcd8; color: var(--bad); font-weight: 700; }
  details { border-top: 1px solid var(--border); padding: 10px 0; }
  summary { cursor: pointer; font-weight: 700; letter-spacing: .02em; font-size: 13px; text-transform: uppercase; color: var(--primary); }
  summary small { text-transform: none; color: var(--muted); font-weight: 400; margin-left: 6px; }
  pre { font-family: var(--mono); font-size: 12px; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto; max-height: 480px; white-space: pre-wrap; word-break: break-word; }
  .story { font-size: 18px; line-height: 1.9; white-space: pre-wrap; background: #fff; border-radius: 10px; padding: 18px 20px; border: 1px solid var(--border); }
  .story h3 { margin: 0 0 10px; font-size: 22px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--border); padding: 4px 8px; text-align: left; vertical-align: top; }
  td.num { text-align: center; font-variant-numeric: tabular-nums; }
  td.low { color: var(--bad); font-weight: 700; }
  ul { margin: 6px 0; padding-left: 18px; }
  .seg { display: grid; grid-template-columns: 110px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--border); font-size: 15px; }
  .seg .t { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .seg.SFX .t, .seg.AMBIENCE .t, .seg.MUSIC_CUE .t { color: var(--primary); }
  .muted { color: var(--muted); }
  .err { color: var(--bad); }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
  .voiceRow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .voiceRow audio { height: 32px; max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1>गोष्टी · Story Engine Tester</h1>
  <span>Developer only — not part of the child experience.</span>
</header>
<main>
  <form id="form" class="card">
    <label>Backend
      <select id="target">
        <option value="local">Local dev server (this page)</option>
        <option value="supabase">Supabase Edge Function</option>
      </select>
    </label>
    <div id="supabaseFields" class="hidden" style="display:grid;gap:10px">
      <label>Supabase project URL <input id="sbUrl" placeholder="https://xxxx.supabase.co" /></label>
      <label>Supabase anon key <input id="sbKey" placeholder="eyJ…" /></label>
    </div>
    <label>Preset <select id="preset"><option value="">— choose a test preset —</option></select></label>
    <div class="row">
      <label>Age <select id="age"></select></label>
      <label>Mode <select id="mode"><option>RANDOM</option><option>CUSTOM</option></select></label>
    </div>
    <label>Category
      <select id="category">
        <option value="animals">animals · प्राण्यांची</option>
        <option value="adventure">adventure · साहस</option>
        <option value="magic">magic · जादूची</option>
        <option value="funny">funny · मजेदार</option>
        <option value="mystery">mystery · रहस्य</option>
        <option value="bedtime">bedtime · झोपतानाची</option>
        <option value="festivals">festivals · सण आणि संस्कृती</option>
        <option value="space">space · अंतराळ</option>
      </select>
    </label>
    <label id="ideaWrap">Custom idea <textarea id="idea" placeholder="एका हत्तीला चंद्रावर जायचं आहे..."></textarea></label>
    <label>Child name (optional) <input id="childName" /></label>
    <button id="go" type="submit">GENERATE STORY</button>
    <div id="status" class="muted"></div>
    <details>
      <summary>Aaji voice audition</summary>
      <p class="muted">Same fixed Marathi paragraph in each voice. Pick one and set TTS_VOICE.</p>
      <div id="voiceList"></div>
    </details>
  </form>

  <section class="card">
    <div id="empty">Choose a preset or fill the form, then generate. Real Gemini stories take about 1–3 minutes.</div>
    <div id="result" class="hidden">
      <div class="summary" id="summary"></div>
      <div id="sections"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const json = (v) => `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;

for (let a = 2; a <= 9; a++) $('age').insertAdjacentHTML('beforeend', `<option ${a === 6 ? 'selected' : ''}>${a}</option>`);

let presets = [];
fetch('/presets').then((r) => r.json()).then((list) => {
  presets = list;
  list.forEach((p, i) => $('preset').insertAdjacentHTML('beforeend', `<option value="${i}">${esc(p.label)}</option>`));
}).catch(() => {});

fetch('/config').then((r) => r.json()).then((c) => {
  if (!$('sbUrl').value) $('sbUrl').value = store.get('sbUrl') || c.supabaseUrl || '';
  if (!$('sbKey').value) $('sbKey').value = store.get('sbKey') || c.supabaseAnonKey || '';
}).catch(() => {});

$('target').value = store.get('target') || 'local';
const syncTarget = () => {
  $('supabaseFields').classList.toggle('hidden', $('target').value !== 'supabase');
  store.set('target', $('target').value);
};
$('target').onchange = syncTarget; syncTarget();
const syncMode = () => $('ideaWrap').classList.toggle('hidden', $('mode').value !== 'CUSTOM');
$('mode').onchange = syncMode; syncMode();

$('preset').onchange = () => {
  const p = presets[Number($('preset').value)];
  if (!p) return;
  $('age').value = p.request.age; $('mode').value = p.request.mode; $('category').value = p.request.category;
  $('idea').value = p.request.userIdea || ''; $('childName').value = p.request.childName || '';
  syncMode();
};

function section(title, html, { open = false, note = '' } = {}) {
  return `<details ${open ? 'open' : ''}><summary>${esc(title)}${note ? `<small>${esc(note)}</small>` : ''}</summary>${html}</details>`;
}

function storyHtml(s) {
  return s ? `<div class="story"><h3>${esc(s.title)}</h3>${esc(s.storyText)}</div>` : '<p class="muted">—</p>';
}

function critiqueHtml(critiques) {
  if (!critiques?.length) return '<p class="muted">No critic runs.</p>';
  const keys = Object.keys(critiques[0].evaluation.scores);
  const flags = Object.keys(critiques[0].evaluation.checks);
  const thresholds = { marathiNaturalness: 8, ageAppropriateness: 8, engagement: 8, coherence: 8, originality: 8, resolutionQuality: 8, audioSuitability: 8 };
  let h = '<table><tr><th>Score</th>' + critiques.map((c) => `<th>Attempt ${c.attempt} ${c.passed ? '✅' : '❌'}</th>`).join('') + '</tr>';
  for (const k of keys) {
    h += `<tr><td>${k}${thresholds[k] ? ' *' : ''}</td>` + critiques.map((c) => {
      const v = c.evaluation.scores[k];
      return `<td class="num ${thresholds[k] && v < thresholds[k] ? 'low' : ''}">${v}</td>`;
    }).join('') + '</tr>';
  }
  for (const f of flags) {
    h += `<tr><td class="muted">${f}</td>` + critiques.map((c) => `<td class="num ${c.evaluation.checks[f] ? 'low' : ''}">${c.evaluation.checks[f] ? 'YES' : '·'}</td>`).join('') + '</tr>';
  }
  h += '</table><p class="muted">* pass threshold 8</p>';
  for (const c of critiques) {
    const e = c.evaluation;
    h += `<h4>Attempt ${c.attempt} — ${c.passed ? 'PASSED' : 'FAILED'}</h4>`;
    if (c.failures.length) h += `<p class="err">${c.failures.map(esc).join('<br>')}</p>`;
    h += `<p><b>Listener verdict:</b> ${esc(e.listenerVerdict)}</p>`;
    h += `<b>Strengths</b><ul>${e.strengths.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
    h += `<b>Weaknesses</b><ul>${e.weaknesses.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
    h += `<b>Rewrite instructions</b><ul>${e.rewriteInstructions.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`;
  }
  return h;
}

function audioHtml(script, warnings) {
  if (!script) return '<p class="muted">—</p>';
  const rows = script.segments.map((s) => {
    let body = '';
    if (s.type === 'NARRATION') body = `${esc(s.text)} ${s.emotion ? `<span class="muted">(${s.emotion})</span>` : ''}`;
    else if (s.type === 'DIALOGUE') body = `<b>${esc(s.character)}</b>${s.voiceStyle ? ` <span class="muted">[${s.voiceStyle}]</span>` : ''}: ${esc(s.text)} ${s.emotion ? `<span class="muted">(${s.emotion})</span>` : ''}`;
    else if (s.type === 'PAUSE') body = `<span class="muted">${s.durationMs} ms</span>`;
    else if (s.type === 'SFX') body = s.soundId;
    else if (s.type === 'AMBIENCE') body = `${s.soundId} ${s.action}`;
    else if (s.type === 'MUSIC_CUE') body = `${s.mood} ${s.action}`;
    return `<div class="seg ${s.type}"><span class="t">${s.type}</span><span>${body}</span></div>`;
  }).join('');
  const warn = warnings?.length ? `<p class="err">${warnings.map(esc).join('<br>')}</p>` : '';
  return warn + rows + section('Raw JSON', json(script));
}

function render(data, ms) {
  const t = data.trace || {};
  const ok = data.status === 'APPROVED';
  const busy = data.status === 'IN_PROGRESS';
  $('summary').innerHTML = [
    `<span class="pill ${ok ? 'ok' : busy ? '' : 'bad'}">${esc(data.status)}${busy ? ` · ${esc(data.phase)}` : ''}</span>`,
    `<span class="pill">provider: ${esc(data.provider?.name)}</span>`,
    `<span class="pill">round trip: ${(ms / 1000).toFixed(1)}s</span>`,
    t.attemptCount != null ? `<span class="pill">attempts: ${t.attemptCount}</span>` : '',
    data.story ? `<span class="pill">≈ ${Math.round(data.story.estimatedDurationSeconds / 6) / 10} min · ${t.drafts?.at(-1)?.wordCount ?? '?'} words</span>` : '',
    `<button class="ghost" type="button" id="copy">Copy full JSON</button>`,
  ].join('');
  $('copy').onclick = () => navigator.clipboard?.writeText(JSON.stringify(data, null, 2));

  const firstDraft = t.drafts?.find((d) => d.kind === 'DRAFT');
  const rewrites = (t.drafts || []).filter((d) => d.kind === 'REWRITE');
  const timings = (t.timings || []).map((x) => `<tr><td>${x.stage}${x.attempt ? ` #${x.attempt}` : ''}</td><td class="num">${(x.ms / 1000).toFixed(1)}s</td><td>${esc(x.model || '')}</td></tr>`).join('');

  const html = [
    data.message ? section('Child-facing message', `<div class="story">${esc(data.message)}</div>`, { open: true }) : '',
    section('Final approved story', storyHtml(t.finalStory) + (ok && data.audioToken ? `<p><button type="button" class="ghost" id="listen">🔊 Listen in Aaji's voice (${data.audioChunks} parts)</button> <button type="button" class="ghost" id="addLib">📚 Add to library</button> <span id="addLibStatus" class="muted"></span></p><div id="listenBox"></div>` : ''), { open: ok, note: ok ? data.story.positiveValue : 'not approved' }),
    section('Request', json({ sent: t.request, normalized: t.normalizedRequest })),
    section('Intent classification', json({ intent: t.intent, safety: t.safety }), { note: t.intent?.intent }),
    section('Development profile', json(t.profile), { note: t.profile?.id }),
    section('Story plan', json({ ingredients: t.varietyIngredients, plan: t.plan }), { note: t.plan?.workingTitle }),
    section('First draft', firstDraft ? storyHtml(firstDraft.story) + `<p class="muted">${firstDraft.wordCount} words</p>` : '<p class="muted">—</p>'),
    section('Critic evaluation', critiqueHtml(t.critiques), { open: !ok && t.critiques?.length > 0 }),
    section('Rewrite history', rewrites.length ? rewrites.map((d) => `<h4>Rewrite (attempt ${d.attempt}) — ${d.wordCount} words</h4>` + storyHtml(d.story)).join('') : '<p class="muted">No rewrites needed.</p>', { note: `${rewrites.length}` }),
    section('Audio script', audioHtml(t.audioScript, t.audioScriptWarnings), { note: t.audioScript ? `${t.audioScript.segments.length} segments` : '' }),
    section('Model used', json(data.provider)),
    section('Latency', `<table><tr><th>Stage</th><th>Time</th><th>Model</th></tr>${timings}<tr><td><b>Total (server)</b></td><td class="num"><b>${((t.totalMs || 0) / 1000).toFixed(1)}s</b></td><td></td></tr></table>`),
    section('Attempt count', `<p>${t.attemptCount ?? 0} of 3</p>`),
    section('Errors', (t.errors?.length || data.errors?.length || data.reason) ? `<pre class="err">${esc([...new Set([...(t.errors || []), ...(data.errors || []), data.reason].filter(Boolean))].join('\n'))}</pre>` : '<p class="muted">None</p>', { open: !ok && !data.message }),
  ].join('');
  $('sections').innerHTML = html;
  if ($('listen')) $('listen').onclick = () => { $('listen').disabled = true; listen(data); };
  if ($('addLib')) $('addLib').onclick = async () => {
    $('addLib').disabled = true;
    // Always saved by the LOCAL dev server (it writes story-engine/library/added.ts).
    const res = await fetch('/library/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ story: data.story }) });
    const r = await res.json().catch(() => ({ ok: false, error: 'local dev server not reachable' }));
    $('addLibStatus').textContent = r.ok ? `Saved as ${r.id} — redeploy + reload the app to include it` : `Not saved: ${r.error}`;
  };
  $('empty').classList.add('hidden');
  $('result').classList.remove('hidden');
}

function endpoint() {
  let url = '/generate-story';
  const headers = { 'Content-Type': 'application/json' };
  if ($('target').value === 'supabase') {
    const base = $('sbUrl').value.trim().replace(/\/$/, '');
    const key = $('sbKey').value.trim();
    store.set('sbUrl', base); store.set('sbKey', key);
    url = `${base}/functions/v1/generate-story`;
    headers.apikey = key; headers.Authorization = `Bearer ${key}`;
  }
  return { url, headers };
}

async function post(payload) {
  const { url, headers } = endpoint();
  const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(payload) });
  const text = await res.text();
  try { return JSON.parse(text); } catch { return { status: 'FAILED', reason: `HTTP ${res.status}: ${text.slice(0, 300)}` }; }
}

function audioUrl(b64, mime) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([bytes], { type: mime || 'audio/wav' }));
}

// ---- Voice audition -------------------------------------------------------
async function loadVoices() {
  const r = await post({ action: 'tts-voices' }).catch(() => null);
  const voices = r?.voices || ['Sulafat', 'Vindemiatrix', 'Gacrux', 'Achernar', 'Aoede'];
  $('voiceList').innerHTML = voices.map((v) => `
    <div class="voiceRow"><button type="button" class="ghost" data-voice="${v}">▶ ${v}${v === r?.current ? ' (current)' : ''}</button><span class="muted" id="vs-${v}"></span></div>`).join('');
  $('voiceList').querySelectorAll('button[data-voice]').forEach((btn) => {
    btn.onclick = async () => {
      const v = btn.dataset.voice;
      $(`vs-${v}`).textContent = 'rendering…';
      btn.disabled = true;
      const r = await post({ action: 'tts-audition', voice: v }).catch((e) => ({ reason: String(e) }));
      btn.disabled = false;
      if (!r.base64) { $(`vs-${v}`).innerHTML = `<span class="err">${esc(r.reason || 'failed')}</span>`; return; }
      $(`vs-${v}`).innerHTML = `${(r.ms / 1000).toFixed(1)}s · ${esc(r.model)} <audio controls autoplay src="${audioUrl(r.base64, r.mimeType)}"></audio>`;
    };
  });
}
$('target').addEventListener('change', loadVoices);
loadVoices();

// ---- Listen to an approved story (chunk by chunk, playing as they arrive) --
async function listen(data) {
  const box = $('listenBox');
  const n = data.audioChunks || 0;
  box.innerHTML = `<p class="muted">Rendering ${n} part(s) in Aaji's voice… playback starts with part 1.</p><div id="parts"></div>`;
  const player = new Audio();
  const queue = [];
  let playing = false;
  const playNext = () => {
    const next = queue.shift();
    if (!next) { playing = false; return; }
    playing = true;
    player.src = next.url;
    player.play().catch(() => {});
    player.onended = () => setTimeout(playNext, next.pauseAfterMs || 0);
  };
  const started = Date.now();
  for (let i = 0; i < n; i++) {
    const r = await post({ action: 'tts-render', audioToken: data.audioToken, chunk: i });
    if (!r.base64) { $('parts').insertAdjacentHTML('beforeend', `<p class="err">Part ${i + 1}: ${esc(r.reason || (r.errors || []).join(', '))}</p>`); break; }
    const url = audioUrl(r.base64, r.mimeType);
    $('parts').insertAdjacentHTML('beforeend', `<div class="voiceRow">Part ${i + 1}: ${(r.ms / 1000).toFixed(1)}s · ${esc(r.model)} <audio controls src="${url}"></audio></div>`);
    if (i === 0) box.insertAdjacentHTML('afterbegin', `<p><b>First audio after ${((Date.now() - started) / 1000).toFixed(1)}s</b></p>`);
    queue.push({ url, pauseAfterMs: r.pauseAfterMs });
    if (!playing) playNext();
  }
}

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const request = { age: Number($('age').value), category: $('category').value, mode: $('mode').value };
  if (request.mode === 'CUSTOM') request.userIdea = $('idea').value;
  if ($('childName').value.trim()) request.childName = $('childName').value.trim();

  const { url, headers } = endpoint();

  $('go').disabled = true;
  const started = Date.now();
  let phaseText = '';
  const tick = setInterval(() => { $('status').textContent = `Generating… ${Math.round((Date.now() - started) / 1000)}s ${phaseText}`; }, 500);
  try {
    let payload = { request, debug: true };
    let data;
    for (let step = 1; step <= 20; step++) {
      const res = await fetch(url, { method: 'POST', headers, body: JSON.stringify(payload) });
      const text = await res.text();
      try { data = JSON.parse(text); } catch { data = { status: 'FAILED', reason: `HTTP ${res.status}: ${text.slice(0, 500)}` }; }
      if (data.status !== 'IN_PROGRESS') break;
      phaseText = `step ${step}: ${data.phase} — ${data.progressLabel}`;
      render(data, Date.now() - started);
      payload = { continuation: data.continuation, debug: true };
    }
    render(data, Date.now() - started);
    $('status').textContent = `Done in ${((Date.now() - started) / 1000).toFixed(1)}s`;
  } catch (err) {
    render({ status: 'FAILED', reason: String(err) }, Date.now() - started);
    $('status').textContent = 'Request failed';
  } finally {
    clearInterval(tick);
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
