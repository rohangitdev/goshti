# Every push to main: check the code, then deploy the story backend (Supabase Edge Function).
# Deploying needs one secret: SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables →
# Actions). Until it is added, the deploy job only leaves a note. No API keys live here — Vertex
# and the other backend settings stay in Supabase secrets.
name: Check and deploy backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Deploy story backend to Supabase
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Is the Supabase token set?
        id: token
        run: |
          # Spaces or a line break pasted with the token are removed. The token is never printed;
          # only which KIND of key it looks like.
          t=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          if [ -z "$t" ]; then
            echo "::notice::Not deployed: add the SUPABASE_ACCESS_TOKEN secret to deploy automatically."
          elif [ "${t#sbp_}" = "$t" ]; then
            case "$t" in
              eyJ*|sb_publishable_*|sb_secret_*) kind="a project API key (anon / service_role / publishable / secret)" ;;
              *) kind="not a Supabase account access token" ;;
            esac
            echo "::error title=Wrong Supabase key::SUPABASE_ACCESS_TOKEN looks like $kind. It must be an account access token starting with sbp_ — supabase.com/dashboard/account/tokens"
            exit 1
          else
            echo "::add-mask::$t"
            echo "SUPABASE_ACCESS_TOKEN=$t" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      - name: Build and deploy generate-story
        if: steps.token.outputs.ok == 'true'
        run: |
          npm ci
          npm run build:function
          set -o pipefail
          if ! supabase functions deploy generate-story --project-ref okcoskjdspwqnvcilbsf --use-api 2>&1 | tee deploy.log; then
            # Show the reason as an annotation (readable from the run page and the API).
            echo "::error title=Supabase deploy failed::$(tail -n 15 deploy.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
