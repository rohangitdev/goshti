# Every push to main: check the code, then deploy the story backend (Supabase Edge Function).
# Deploying needs one secret: SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables →
# Actions). Until it is added, the deploy job only leaves a note. No API keys live here — Vertex
# and the other backend settings stay in Supabase secrets.
name: Check and deploy backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    name: Deploy story backend to Supabase
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Is the Supabase token set?
        id: token
        run: |
          # Picks the sbp_… token out of whatever was pasted (quotes, spaces, hidden characters).
          # The value is never printed — only its length and shape when it can't be used.
          raw="$SUPABASE_ACCESS_TOKEN"
          t=$(printf '%s' "$raw" | grep -oE 'sbp_[A-Za-z0-9_]{20,}' | head -n 1 || true)
          if [ -z "$raw" ]; then
            echo "::notice::Not deployed: add the SUPABASE_ACCESS_TOKEN secret to deploy automatically."
          elif [ -z "$t" ]; then
            len=$(printf '%s' "$raw" | wc -m | tr -d ' ')
            hint=""
            case "$raw" in *…*|*•*|*...*) hint="$hint It contains dots — that is the shortened display, not the full token." ;; esac
            if printf '%s' "$raw" | grep -qiE 'sbp'; then hint="$hint It has sbp in it but not a complete token."; fi
            if [ "$len" -lt 40 ]; then hint="$hint It is short — probably the token's NAME, not the token."; fi
            case "$raw" in eyJ*|sb_publishable_*|sb_secret_*) hint="$hint It is a project API key, not an account token." ;; esac
            echo "::error title=Wrong Supabase key::The saved SUPABASE_ACCESS_TOKEN ($len characters) has no sbp_ token in it.$hint Copy the long value shown once after Generate new token at supabase.com/dashboard/account/tokens."
            exit 1
          else
            echo "::add-mask::$t"
            echo "SUPABASE_ACCESS_TOKEN=$t" >> "$GITHUB_ENV"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest
      - name: Build and deploy generate-story
        if: steps.token.outputs.ok == 'true'
        run: |
          npm ci
          npm run build:function
          set -o pipefail
          if ! supabase functions deploy generate-story --project-ref okcoskjdspwqnvcilbsf --use-api 2>&1 | tee deploy.log; then
            # Show the reason as an annotation (readable from the run page and the API).
            echo "::error title=Supabase deploy failed::$(tail -n 15 deploy.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
